<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione studente</title>
</head>
<body>
    <h1>Registrazione studente</h1>
    <form action="" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" name="cognome" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="eta">Età:</label>
        <input type="number" id="eta" name="eta">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <p>Tipo studente:</p>

        <input type="radio" id="interno" name="tipoStudente" value="interno">
        <label for="interno">Interno</label>

        <input type="radio" id="esterno" name="tipoStudente" value="esterno">
        <label for="esterno">Esterno</label>

        <br><br>

        <label for="corso">Corso:</label>

        <select id="corso" name="corso">
        <option value="informatica">Informatica</option>
        <option value="elettronica">Elettronica</option>
        <option value="meccanica">Meccanica:</option>
        </select>

        <br><br>

        <label for="note">Note:</label>
        <br>
        <textarea id="note" name="note" rows="4" cols="30"></textarea>

        <br><br>

        <input type="checkbox" id="regolamento" name="regolamento" required>
        <label for="regolamento">Accetto il regolamento</label>

        <br><br>

        <button type="submit">Invia</button>
        
    </form>
</body>
</html>
